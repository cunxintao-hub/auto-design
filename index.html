<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车项目专栏 · 陶存心</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --link:#58a6ff; --gold:#e3b341; --purple:#a371f7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.75; font-size:15px; }
  .wrap { max-width:900px; margin:0 auto; padding:56px 20px 70px; }
  .topnav { font-size:13px; color:var(--muted); margin-bottom:26px; }
  .topnav a { color:var(--link); text-decoration:none; }

  header { text-align:center; margin-bottom:12px; }
  header h1 { font-size:32px; font-weight:600; letter-spacing:1px; }
  header .sub { color:var(--muted); margin-top:10px; font-size:15px; }
  .notice { text-align:center; color:#6b7590; font-size:12.5px; margin:18px auto 44px; padding:10px 16px; max-width:640px; border:1px dashed var(--border); border-radius:6px; }

  .zones { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:720px){ .zones { grid-template-columns:1fr; } }

  .zone {
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden;
    transition:border-color .15s, transform .15s;
  }
  .zone:hover { border-color:#8b949e; transform:translateY(-3px); }
  .zone .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#000; border-bottom:1px solid var(--border); }
  .zone .body { padding:22px 24px 24px; }
  .zone h2 { font-size:19px; font-weight:600; margin-bottom:8px; }
  .zone .desc { color:var(--muted); font-size:14px; margin-bottom:14px; min-height:44px; }
  .zone .meta { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tag { font-size:12px; padding:2px 10px; border-radius:20px; border:1px solid var(--border); color:var(--muted); }
  .tag.gold { border-color:rgba(227,179,65,.5); color:var(--gold); }
  .tag.blue { border-color:rgba(88,166,255,.5); color:var(--link); }
  .tag.purple { border-color:rgba(163,113,247,.5); color:var(--purple); }
  .zone .go { color:var(--link); font-size:14px; font-weight:500; }

  footer { text-align:center; margin-top:52px; color:#6b7590; font-size:13px; line-height:2; }
  footer a { color:var(--link); text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topnav"><a href="https://cunxintao-hub.github.io/">← 返回个人主页</a></div>

    <header>
      <h1>🚗 汽车项目专栏</h1>
      <div class="sub">智能座舱 HMI · 飞行汽车交互 · 共 2 个项目</div>
    </header>

    <div class="notice">点击卡片进入项目详情</div>

    <div class="zones">

      <!-- 01 理想汽车 -->
      <a class="zone" href="./li-auto.html">
        <img class="thumb" src="./li-auto/preview/A2-1.jpg" alt="理想汽车项目封面">
        <div class="body">
          <h2>01 · 理想汽车 UX 设计</h2>
          <p class="desc">基于多模态交互的车载情感体验设计，与理想汽车合作的校企合作项目。</p>
          <div class="meta">
            <span class="tag gold">未来设计师 国三</span>
            <span class="tag blue">智能座舱 HMI</span>
            <span class="tag purple">多模态交互</span>
          </div>
          <span class="go">进入项目 →</span>
        </div>
      </a>

      <!-- 02 飞行汽车 -->
      <a class="zone" href="./flying-car.html">
        <img class="thumb" src="./l4-cockpit/preview/overview.jpg" alt="飞行汽车项目封面">
        <div class="body">
          <h2>02 · L4 无人驾驶 HMI 体验</h2>
          <p class="desc">教育部产学研项目（飞行汽车平台 · 小鹏合作），研究 L4 驾驶模式下的人机交互体验。</p>
          <div class="meta">
            <span class="tag gold">教育部产学研</span>
            <span class="tag blue">飞行汽车</span>
            <span class="tag purple">小鹏汽车</span>
          </div>
          <span class="go">进入项目 →</span>
        </div>
      </a>

    </div>

    <footer>
      <p>© 2026 陶存心</p>
      <p><a href="https://cunxintao-hub.github.io/">个人主页</a> · <a href="https://github.com/cunxintao-hub">GitHub</a> · <a href="https://cunxintao-hub.github.io/ai-creation/">AI 创作</a></p>
      <p style="margin-top:10px;color:#8b949e;">“人，不过是需要超越的存在。我们为超越自身，究竟做了什么。”</p>
    </footer>
  </div>
</body>
</html>
